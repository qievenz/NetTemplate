  reacttswithnetcoretemplate.postgres:
    image: postgres:16-alpine
    container_name: reacttswithnetcoretemplate_postgres_db
    restart: always
    environment:
      POSTGRES_USER: reacttswithnetcoretemplate_usr
      POSTGRES_PASSWORD: ChangeThis!!1
      POSTGRES_DB: reacttswithnetcoretemplate_db
    ports:
      - "5432:5432"
    volumes:
      - reacttswithnetcoretemplate_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  reacttswithnetcoretemplate.api:
    image: ${DOCKER_REGISTRY-}reacttswithnetcoretemplateapi
    container_name: reacttswithnetcoretemplate_api
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/ReactTSWithNetCoreTemplate.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Release
      - ASPNETCORE_URLS=http://+:80
      - TZ=America/Buenos_Aires
     # - ConnectionStrings__DefaultConnection=Server=reacttswithnetcoretemplate_mssql_db,1433;Database=ReactTSWithNetCoreTemplateDB;User=sa;Password=ChangeThis!!1;TrustServerCertificate=True;
      - ConnectionStrings__DefaultConnection=Server=reacttswithnetcoretemplate_postgres_db;Port=5432;Database=reacttswithnetcoretemplate_db;Username=reacttswithnetcoretemplate_usr;Password=ChangeThis!!1
      - ApiKeyAuthOptions__SecretToken=SecretTokenToTest123

  reacttswithnetcoretemplate.client:
    image: ${DOCKER_REGISTRY-}reacttswithnetcoretemplateclient
    build:
      context: src/reacttswithnetcoretemplate.client
      dockerfile: ./Dockerfile
    container_name: reacttswithnetcoretemplate_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - reacttswithnetcoretemplate.api

volumes:
 # reacttswithnetcoretemplate_mssql_data:
 reacttswithnetcoretemplate_pg_data:

